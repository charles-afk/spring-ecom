<div class="login-status">

  @if (isAuthenticated()) {
    <span class="login-welcome">
      <span class="welcome-label">Welcome back</span>
      <span class="login-email">{{ userEmail }}</span>
    </span>
  }

  <div class="login-actions">
    @if (!isAuthenticated()) {
      <button
        type="button"
        class="login-btn login-btn-primary"
        (click)="login()">
        Login
      </button>
    } @else {
      <a
        routerLink="/members"
        class="login-btn login-btn-secondary">
        Member
      </a>

      <a
        routerLink="/order-history"
        class="login-btn login-btn-secondary">
        Orders
      </a>

      <button
        type="button"
        class="login-btn login-btn-primary"
        (click)="logout()">
        Logout
      </button>
    }
  </div>

</div>
