<form class="store-search" role="search" (submit)="$event.preventDefault(); searchProduct(searchInput.value)">
  <div class="store-search-icon" aria-hidden="true">
    <i class="bi bi-search"></i>
  </div>

  <input
    #searchInput
    class="store-search-input"
    type="search"
    name="search"
    placeholder="Search products..."
    aria-label="Search products"
    autocomplete="off"
  />

  <button class="store-search-button" type="submit">
    <span>Search</span>
  </button>
</form>
