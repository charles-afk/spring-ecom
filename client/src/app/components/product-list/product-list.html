<div class="main-content">
  <div class="section-content section-content-p30">
    <div class="container-fluid">

      <!-- Product grid -->
      <div class="row g-4">
        @if (products().length !== 0) {
          @for (product of products(); track product.id) {
            <div class="col-6 col-md-4 col-xl-3">
              <div class="card product-card h-100">

                <!-- Product image -->
                <a
                  [routerLink]="['/products', product.id]"
                  class="product-image-wrapper"
                  [attr.aria-label]="'View ' + product.name"
                >
                  <img
                    [src]="product.imageUrl"
                    [alt]="product.name"
                    class="card-img-top product-image"
                    loading="lazy"
                  />
                </a>

                <!-- Product details -->
                <div class="card-body d-flex flex-column">
                  <a
                    [routerLink]="['/products', product.id]"
                    class="product-title-link"
                    [attr.aria-label]="'View product: ' + product.name"
                  >
                    <h5 class="card-title product-title">
                      {{ product.name }}
                    </h5>
                  </a>

                  <div class="product-price mt-auto">
                    {{ product.unitPrice | currency: 'USD' }}
                  </div>

                  <button
                    type="button"
                    (click)="addToCart(product)"
                    class="btn btn-primary add-to-cart-btn mt-3"
                  >
                    <i class="bi bi-cart-plus me-2" aria-hidden="true"></i>
                    Add to Cart
                  </button>
                </div>

              </div>
            </div>
          }
        } @else {
          <div class="col-12">
            <div class="alert alert-warning text-center py-4" role="alert">
              <h5 class="alert-heading">No products found</h5>
              <p class="mb-0">
                Try again later or browse another category.
              </p>
            </div>
          </div>
        }
      </div>

      <!-- Pagination -->
      @if (products().length !== 0) {
        <div class="pagination-container mt-5">
          <div class="row align-items-center g-3">

            <div class="col-12 col-md-8">
              <div class="d-flex justify-content-center justify-content-md-start
                          overflow-x-auto">
                <ngb-pagination
                  [(page)]="pageNumber"
                  [pageSize]="pageSize()"
                  [collectionSize]="totalElements()"
                  (pageChange)="listProducts()"
                  [maxSize]="5"
                  [rotate]="true"
                  [boundaryLinks]="true"
                  [ellipses]="true"
                  aria-label="Product pages"
                  class="mb-0"
                ></ngb-pagination>
              </div>
            </div>

            <div class="col-12 col-md-4">
              <div class="page-size-control">
                <label for="pageSizeSelect" class="form-label mb-0">
                  Products per page
                </label>

                <select
                  id="pageSizeSelect"
                  #pageSelect
                  class="form-select page-size-select"
                  [value]="pageSize()"
                  (change)="updatePageSize(pageSelect.value)"
                >
                  <option value="5">5</option>
                  <option value="10">10</option>
                  <option value="20">20</option>
                  <option value="50">50</option>
                </select>
              </div>
            </div>

          </div>
        </div>
      }

    </div>
  </div>
</div>
